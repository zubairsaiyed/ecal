<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECAL Grid Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            padding: 0;
            margin: 0;
            line-height: 1.4;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            max-height: 100vh;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .calendar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e0e0e0;
            border: none;
            margin: 0;
            padding: 0;
            flex-shrink: 0;
            height: 60px;
            min-height: 60px;
            max-height: 60px;
        }

        .weekday {
            background: #e0e0e0;
            padding: 16px 8px;
            text-align: center;
            font-weight: var(--font-weight-weekday, 700);
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #000000;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: auto;
            gap: 1px;
            background: #e0e0e0;
            border: none;
            margin: 0;
            padding: 0;
            flex: 1 1 0;
            min-height: 0;
            height: calc(100vh - 60px);
            max-height: calc(100vh - 60px);
            overflow: hidden;
            align-content: start;
        }

        .day-cell {
            background: #ffffff;
            min-height: min-content;
            height: auto;
            padding: 12px;
            border: none;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .day-cell.other-month .weather-info {
            opacity: 0.6;
        }

        .day-cell.past .weather-info {
            opacity: 0.5;
        }

        .day-cell.other-month {
            background: #f9f9f9;
            color: #999999;
        }

        .day-cell.past {
            background: #f8f8f8;
        }

        .day-cell.past .day-number {
            color: #cccccc;
            font-weight: 400;
            border-bottom-color: #e8e8e8;
        }

        .day-cell.today {
            background: #f0f0f0;
            outline: 1px solid #000000;
            outline-offset: -1px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #e0e0e0;
        }

        .day-number {
            font-size: 28px;
            font-weight: var(--font-weight-day-number, 600);
        }

        .day-cell.today .day-header {
            border-bottom: 3px solid #000000;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            font-size: 16px;
            line-height: 1.2;
        }

        .weather-icon {
            font-size: 20px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .weather-temps {
            display: flex;
            gap: 4px;
            font-weight: 600;
        }

        .weather-high {
            color: #000000;
        }

        .weather-low {
            color: #666666;
        }

        .events-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 0 1 auto;
            min-height: 0;
            overflow-y: visible;
        }

        .event {
            padding: 6px 10px;
            margin: 0;
            font-size: 20px;
            border-left: 4px solid #000000;
            background: #ffffff;
            cursor: default;
            line-height: 1.4;
        }

        .event.past {
            background: #f8f8f8;
            border-left-color: #cccccc;
        }

        .event.past .event-time,
        .event.past .event-title {
            color: #aaaaaa;
            font-weight: 400;
        }

        .event-time {
            font-weight: var(--font-weight-event-time, 600);
            color: #000000;
            margin-right: 8px;
            font-size: 20px;
            display: inline-block;
        }

        .event-title {
            color: #000000;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 20px;
            font-weight: var(--font-weight-event-title, 400);
            word-wrap: break-word;
            word-break: break-word;
        }

        .event.all-day {
            border-left-color: #666666;
            background: #f5f5f5;
        }

        .event.all-day .event-time {
            color: #666666;
        }

        .more-events {
            font-size: 18px;
            color: #666666;
            padding: 4px 12px;
            font-style: italic;
        }

        /* Responsive adjustments for e-paper displays */
        /* Optimized for 13.3" 1200x1600 e-ink display */
        @media (max-width: 1200px) {
            .day-cell {
                min-height: 180px;
                padding: 10px;
            }
            .event {
                font-size: 18px;
                padding: 5px 8px;
            }
            .day-number {
                font-size: 24px;
            }
            .weekday {
                font-size: 22px;
                background: #e0e0e0;
                border-bottom: 2px solid #000000;
            }
        }

        @media (max-width: 800px) {
            .day-cell {
                min-height: 140px;
                padding: 8px;
            }
            .event {
                font-size: 16px;
                padding: 4px 6px;
            }
            .day-number {
                font-size: 20px;
            }
            .weekday {
                font-size: 18px;
                padding: 12px 6px;
                background: #e0e0e0;
                border-bottom: 2px solid #000000;
            }
        }

        /* Color e-ink optimized colors - matching spectra6 theme */
        .event-color-1 { border-left-color: #000000; } /* Black - vivid-black */
        .event-color-2 { border-left-color: #e60000; } /* Red - vivid-red */
        .event-color-3 { border-left-color: #ffd600; } /* Yellow - vivid-yellow */
        .event-color-4 { border-left-color: #0057e7; } /* Blue - vivid-blue */
        .event-color-5 { border-left-color: #000000; } /* Black fallback */
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="weekdays-header" id="weekdays-header"></div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <script>
        const SETTINGS = {{ settings|tojson }};
        const FIRST_DAY = SETTINGS.first_day || 0; // 0 = Sunday, 1 = Monday
        const GRID_WEEKS = Math.max(1, Math.min(4, SETTINGS.grid_weeks || 2));
        const THEME = SETTINGS.theme || 'spectra6';
        const CALENDAR_COLORS = SETTINGS.calendar_colors || {};
        
        // Set font weight CSS variables from settings
        document.documentElement.style.setProperty('--font-weight-weekday', SETTINGS.font_weight_weekday || 600);
        document.documentElement.style.setProperty('--font-weight-day-number', SETTINGS.font_weight_day_number || 600);
        document.documentElement.style.setProperty('--font-weight-event-time', SETTINGS.font_weight_event_time || 600);
        document.documentElement.style.setProperty('--font-weight-event-title', SETTINGS.font_weight_event_title || 400);

        // Theme palettes
        const spectra_palette = {
            'vivid-red': '#e60000',
            'vivid-yellow': '#ffd600',
            'vivid-blue': '#0057e7',
            'vivid-black': '#000000'
        };
        const default_palette = [
            '#1E90FF', '#e60000', '#ffd600', '#28a745', '#6f42c1', '#000000'
        ];

        const WEEKDAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const WEEKDAY_NAMES_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        function getEventColor(event) {
            const calendarId = event.calendarId || '';
            let color = null;
            
            if (calendarId in CALENDAR_COLORS) {
                const colorKey = CALENDAR_COLORS[calendarId];
                if (THEME === 'spectra6' && colorKey in spectra_palette) {
                    color = spectra_palette[colorKey];
                } else if (THEME !== 'spectra6' && colorKey.startsWith('#') && (colorKey.length === 7 || colorKey.length === 4)) {
                    color = colorKey;
                }
            }
            
            // Fallback to palette
            if (!color) {
                if (THEME === 'spectra6') {
                    const vividKeys = Object.keys(spectra_palette);
                    const idx = Math.abs(hashCode(calendarId)) % vividKeys.length;
                    color = spectra_palette[vividKeys[idx]];
                } else {
                    const idx = Math.abs(hashCode(calendarId)) % default_palette.length;
                    color = default_palette[idx];
                }
            }
            
            // Map color to event-color class
            if (color === '#000000' || color === '#000') return 'event-color-1';
            if (color === '#e60000') return 'event-color-2';
            if (color === '#ffd600') return 'event-color-3';
            if (color === '#0057e7') return 'event-color-4';
            return 'event-color-1'; // Default to black
        }

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            return hash;
        }

        // Weather data cache
        let weatherCache = {};
        let weatherCacheDateRange = null;

        // Fetch weather data from API
        async function fetchWeatherData(startDate, endDate) {
            const startDateStr = startDate.toISOString().split('T')[0];
            const endDateStr = endDate.toISOString().split('T')[0];
            
            // Check if we have cached data for this range
            if (weatherCacheDateRange && 
                weatherCacheDateRange.start <= startDateStr && 
                weatherCacheDateRange.end >= endDateStr &&
                Object.keys(weatherCache).length > 0) {
                return weatherCache;
            }
            
            try {
                const response = await fetch(`/api/weather?start_date=${startDateStr}&end_date=${endDateStr}`);
                if (!response.ok) {
                    console.warn('Weather API error, returning null data (will show dashes)');
                    return getNullWeatherData(startDate, endDate);
                }
                const data = await response.json();
                if (data.error) {
                    console.warn('Weather API error:', data.error);
                    return getNullWeatherData(startDate, endDate);
                }
                // Cache the data
                weatherCache = data;
                weatherCacheDateRange = { start: startDateStr, end: endDateStr };
                return data;
            } catch (error) {
                console.warn('Weather fetch error:', error);
                return getNullWeatherData(startDate, endDate);
            }
        }

        // Return null weather data (will display as dashes)
        function getNullWeatherData(startDate, endDate) {
            const result = {};
            const currentDate = new Date(startDate);
            while (currentDate <= endDate) {
                const dateKey = getDateKey(currentDate);
                result[dateKey] = null;  // Will display as dashes
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return result;
        }

        // Clear weather cache and refresh weather data
        function clearWeatherCache() {
            weatherCache = {};
            weatherCacheDateRange = null;
            console.log('Weather cache cleared');
        }

        // Refresh weather and re-render calendar
        async function refreshWeatherAndRender() {
            console.log('Refreshing weather data...');
            clearWeatherCache();
            
            // Re-fetch events and re-render with fresh weather
            try {
                const eventsResponse = await fetch('/api/events');
                const events = await eventsResponse.json();
                setWeeksVariable();
                renderWeekdays();
                await renderCalendar(events);
                setTimeout(() => {
                    adjustRowHeights();
                    setTimeout(signalRenderComplete, 50);
                }, 100);
                console.log('Weather refreshed and calendar re-rendered');
            } catch (error) {
                console.error('Error refreshing weather:', error);
            }
        }

        // Schedule weather refresh at 12pm and 12am
        function scheduleWeatherRefresh() {
            function getNextRefreshTime() {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                const currentSecond = now.getSeconds();
                
                // Calculate milliseconds until next 12pm or 12am
                let nextRefresh = new Date();
                nextRefresh.setSeconds(0);
                nextRefresh.setMilliseconds(0);
                
                if (currentHour < 12) {
                    // Next refresh is at 12pm today
                    nextRefresh.setHours(12);
                    nextRefresh.setMinutes(0);
                } else if (currentHour >= 12 && currentHour < 24) {
                    // After 12pm, next refresh is at 12am tomorrow
                    if (currentHour === 12 && currentMinute === 0 && currentSecond === 0) {
                        // Exactly 12pm, refresh now and schedule next for 12am
                        return { immediate: true, nextTime: null };
                    } else {
                        // After 12pm, next is 12am tomorrow
                        nextRefresh.setDate(nextRefresh.getDate() + 1);
                        nextRefresh.setHours(0);
                        nextRefresh.setMinutes(0);
                    }
                }
                
                // If we're exactly at 12am, refresh now
                if (currentHour === 0 && currentMinute === 0 && currentSecond === 0) {
                    return { immediate: true, nextTime: nextRefresh };
                }
                
                return { immediate: false, nextTime: nextRefresh };
            }
            
            function scheduleNext() {
                const { immediate, nextTime } = getNextRefreshTime();
                
                if (immediate) {
                    refreshWeatherAndRender();
                    // Schedule the next one (12 hours later)
                    setTimeout(() => {
                        scheduleNext();
                    }, 12 * 60 * 60 * 1000); // 12 hours in milliseconds
                } else if (nextTime) {
                    const msUntilNext = nextTime.getTime() - Date.now();
                    console.log(`Weather refresh scheduled for ${nextTime.toLocaleString()}`);
                    setTimeout(() => {
                        refreshWeatherAndRender();
                        scheduleNext(); // Schedule the next refresh
                    }, msUntilNext);
                }
            }
            
            // Start scheduling
            scheduleNext();
        }

        function getMockWeatherForDate(dateKey) {
            const seed = hashCode(dateKey);
            const dayOfYear = getDayOfYear(dateKey);
            
            // Generate temperatures based on day of year (simulating seasons)
            const seasonalVariation = Math.sin((dayOfYear / 365) * 2 * Math.PI) * 15;
            const randomVariation = (seed % 20) - 10;
            const baseTemp = 70 + seasonalVariation + randomVariation;
            
            const high = Math.round(baseTemp + 5 + (seed % 10));
            const low = Math.round(baseTemp - 5 - (seed % 10));
            
            // Generate icon
            const icons = ['☀️', '⛅', '☁️', '🌧️', '⛈️', '❄️', '🌫️', '🌤️', '🌦️', '☀️'];
            const icon = icons[seed % icons.length];
            
            return { high, low, icon };
        }

        function getDayOfYear(dateKey) {
            const date = new Date(dateKey);
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            return Math.floor(diff / (1000 * 60 * 60 * 24));
        }

        function formatTime(dateString, allDay) {
            if (allDay) return 'All Day';
            const date = new Date(dateString);
            let hours = date.getHours();
            const minutes = date.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 should be 12
            const minutesStr = minutes.toString().padStart(2, '0');
            return `${hours}:${minutesStr} ${ampm}`;
        }

        function isAllDayEvent(event) {
            return event.start && !event.start.includes('T');
        }

        // Parse date string as local date (not UTC) to avoid timezone issues
        function parseLocalDate(dateString) {
            if (!dateString) return null;
            // If it's a date-only string (YYYY-MM-DD), parse as local date
            if (!dateString.includes('T')) {
                const [year, month, day] = dateString.split('-').map(Number);
                return new Date(year, month - 1, day);
            }
            // Otherwise parse normally (includes time)
            return new Date(dateString);
        }

        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function getWeekStart(date, firstDay) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = firstDay === 0 ? day : (day === 0 ? 6 : day - 1);
            d.setDate(d.getDate() - diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        // Calculate default row height based on available space
        function calculateDefaultRowHeight() {
            const header = document.querySelector('.weekdays-header');
            const headerHeight = header ? header.offsetHeight : 60;
            const availableHeight = window.innerHeight - headerHeight;
            const gapSize = 1; // 1px gap between rows
            const totalGaps = (GRID_WEEKS - 1) * gapSize;
            return (availableHeight - totalGaps) / GRID_WEEKS;
        }

        // Calculate how many events fit within a given height for past dates
        function calculateEventsThatFit(events, maxHeight, dayHeader, cellPadding) {
            if (events.length === 0) {
                return { visibleCount: 0, hiddenCount: 0 };
            }

            // Create a temporary container to measure event heights
            const tempContainer = document.createElement('div');
            tempContainer.style.position = 'absolute';
            tempContainer.style.visibility = 'hidden';
            tempContainer.style.width = '200px'; // Approximate cell width for measurement
            tempContainer.style.padding = `${cellPadding}px`;
            tempContainer.style.overflow = 'visible';
            tempContainer.className = 'day-cell';
            
            // Clone the day header to measure its height
            const clonedHeader = dayHeader.cloneNode(true);
            tempContainer.appendChild(clonedHeader);
            
            // Measure day header height first
            document.body.appendChild(tempContainer);
            const headerHeight = clonedHeader.offsetHeight;
            
            // Calculate available height for events
            const eventGap = 6; // gap between events (from CSS)
            const moreEventsHeight = 30; // approximate height for "+X more" indicator
            const availableHeightForEvents = maxHeight - headerHeight - cellPadding * 2 - moreEventsHeight;
            
            // Create events container
            const tempEventsContainer = document.createElement('div');
            tempEventsContainer.className = 'events-container';
            tempContainer.appendChild(tempEventsContainer);
            
            let eventsThatFit = 0;
            
            // Measure each event by actually rendering it
            for (let i = 0; i < events.length; i++) {
                const event = events[i];
                const isAllDay = isAllDayEvent(event);
                const eventStart = parseLocalDate(event.start);
                const eventEnd = parseLocalDate(event.end || event.start);
                const now = new Date();
                const isEventPast = eventEnd < now;
                
                const eventDiv = document.createElement('div');
                let eventClass = 'event ' + getEventColor(event);
                if (isAllDay) eventClass += ' all-day';
                if (isEventPast) eventClass += ' past';
                eventDiv.className = eventClass;
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'event-time';
                timeSpan.textContent = formatTime(event.start, isAllDay);
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'event-title';
                titleSpan.textContent = event.title || 'No Title';
                
                eventDiv.appendChild(timeSpan);
                eventDiv.appendChild(titleSpan);
                tempEventsContainer.appendChild(eventDiv);
                
                // Measure the total height after adding this event
                const totalEventsHeight = tempEventsContainer.offsetHeight;
                
                // Check if adding this event would exceed available height
                if (totalEventsHeight <= availableHeightForEvents) {
                    eventsThatFit++;
                } else {
                    // This event doesn't fit, remove it and stop
                    tempEventsContainer.removeChild(eventDiv);
                    break;
                }
            }
            
            // Clean up
            document.body.removeChild(tempContainer);
            
            return {
                visibleCount: eventsThatFit,
                hiddenCount: events.length - eventsThatFit
            };
        }

        function renderWeekdays() {
            const header = document.getElementById('weekdays-header');
            header.innerHTML = '';
            
            const weekdays = FIRST_DAY === 0 
                ? WEEKDAY_NAMES 
                : [...WEEKDAY_NAMES.slice(1), WEEKDAY_NAMES[0]];
            
            weekdays.forEach(day => {
                const div = document.createElement('div');
                div.className = 'weekday';
                div.textContent = day;
                header.appendChild(div);
            });
        }

        async function renderCalendar(events) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const weekStart = getWeekStart(today, FIRST_DAY);
            const startDate = new Date(weekStart);
            const endDate = new Date(weekStart);
            endDate.setDate(endDate.getDate() + (GRID_WEEKS * 7) - 1);
            
            // Fetch weather data
            const weatherData = await fetchWeatherData(startDate, endDate);
            
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            // Group events by date
            const eventsByDate = {};
            events.forEach(event => {
                const isAllDay = isAllDayEvent(event);
                // Parse dates as local dates to avoid timezone issues with all-day events
                const start = parseLocalDate(event.start);
                let end = parseLocalDate(event.end || event.start);
                
                // Handle multi-day events
                const currentDate = new Date(start);
                currentDate.setHours(0, 0, 0, 0);
                
                // For all-day events, end date is exclusive (day after event ends)
                // For timed events, end is the actual end time
                let endDateOnly = new Date(end);
                if (isAllDay) {
                    endDateOnly.setHours(0, 0, 0, 0);
                    endDateOnly.setDate(endDateOnly.getDate() - 1); // Make inclusive
                } else {
                    endDateOnly.setHours(0, 0, 0, 0);
                    // If end time is at midnight, it's the next day, so subtract 1
                    if (end.getHours() === 0 && end.getMinutes() === 0) {
                        endDateOnly.setDate(endDateOnly.getDate() - 1);
                    }
                }
                
                while (currentDate <= endDateOnly) {
                    const dateKey = getDateKey(currentDate);
                    if (!eventsByDate[dateKey]) {
                        eventsByDate[dateKey] = [];
                    }
                    // Create event copy for this day
                    const dayEvent = {
                        ...event,
                        displayDate: new Date(currentDate)
                    };
                    eventsByDate[dateKey].push(dayEvent);
                    currentDate.setDate(currentDate.getDate() + 1);
                }
            });
            
            // Sort events within each day
            Object.keys(eventsByDate).forEach(dateKey => {
                eventsByDate[dateKey].sort((a, b) => {
                    const aTime = isAllDayEvent(a) ? 0 : parseLocalDate(a.start).getTime();
                    const bTime = isAllDayEvent(b) ? 0 : parseLocalDate(b.start).getTime();
                    return aTime - bTime;
                });
            });
            
            // Render days
            const currentDate = new Date(startDate);
            const todayKey = getDateKey(today);
            const startMonth = startDate.getMonth();
            
            while (currentDate <= endDate) {
                const dateKey = getDateKey(currentDate);
                const isToday = dateKey === todayKey;
                const isPast = currentDate < today;
                const isOtherMonth = currentDate.getMonth() !== startMonth;
                
                const dayCell = document.createElement('div');
                let dayCellClass = 'day-cell';
                if (isOtherMonth) dayCellClass += ' other-month';
                if (isPast) dayCellClass += ' past';
                if (isToday) dayCellClass += ' today';
                dayCell.className = dayCellClass;
                
                // Create day header with number and weather
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = currentDate.getDate();
                dayHeader.appendChild(dayNumber);
                
                // Add weather info
                const weatherInfo = document.createElement('div');
                weatherInfo.className = 'weather-info';
                
                // Get weather data for this date
                const dateWeather = weatherData[dateKey];
                
                if (dateWeather && dateWeather.high !== null && dateWeather.low !== null) {
                    // Valid weather data available
                    const weatherIcon = document.createElement('div');
                    weatherIcon.className = 'weather-icon';
                    weatherIcon.textContent = dateWeather.icon || '☀️';
                    weatherInfo.appendChild(weatherIcon);
                    
                    const weatherTemps = document.createElement('div');
                    weatherTemps.className = 'weather-temps';
                    const highSpan = document.createElement('span');
                    highSpan.className = 'weather-high';
                    highSpan.textContent = dateWeather.high + '°';
                    const lowSpan = document.createElement('span');
                    lowSpan.className = 'weather-low';
                    lowSpan.textContent = dateWeather.low + '°';
                    weatherTemps.appendChild(highSpan);
                    weatherTemps.appendChild(lowSpan);
                    weatherInfo.appendChild(weatherTemps);
                } else {
                    // No weather data available - show dashes
                    const weatherIcon = document.createElement('div');
                    weatherIcon.className = 'weather-icon';
                    weatherIcon.textContent = '—';
                    weatherInfo.appendChild(weatherIcon);
                    
                    const weatherTemps = document.createElement('div');
                    weatherTemps.className = 'weather-temps';
                    const highSpan = document.createElement('span');
                    highSpan.className = 'weather-high';
                    highSpan.textContent = '—';
                    const lowSpan = document.createElement('span');
                    lowSpan.className = 'weather-low';
                    lowSpan.textContent = '—';
                    weatherTemps.appendChild(highSpan);
                    weatherTemps.appendChild(lowSpan);
                    weatherInfo.appendChild(weatherTemps);
                }
                
                dayHeader.appendChild(weatherInfo);
                dayCell.appendChild(dayHeader);
                
                const eventsContainer = document.createElement('div');
                eventsContainer.className = 'events-container';
                
                const dayEvents = eventsByDate[dateKey] || [];
                
                // For past dates, truncate events to fit within default row height
                let eventsToRender = dayEvents;
                let hiddenEventCount = 0;
                
                if (isPast && dayEvents.length > 0) {
                    // Calculate default row height for this row
                    const defaultRowHeight = calculateDefaultRowHeight();
                    const cellPadding = 12; // From CSS: padding: 12px
                    
                    // Calculate how many events fit
                    const fittingResult = calculateEventsThatFit(dayEvents, defaultRowHeight, dayHeader, cellPadding);
                    eventsToRender = dayEvents.slice(0, fittingResult.visibleCount);
                    hiddenEventCount = fittingResult.hiddenCount;
                }
                
                eventsToRender.forEach(event => {
                    // Check if event is in the past
                    const eventStart = parseLocalDate(event.start);
                    const eventEnd = parseLocalDate(event.end || event.start);
                    const now = new Date();
                    const isEventPast = eventEnd < now;
                    
                    const eventDiv = document.createElement('div');
                    let eventClass = 'event ' + getEventColor(event);
                    if (isAllDayEvent(event)) eventClass += ' all-day';
                    if (isEventPast) eventClass += ' past';
                    eventDiv.className = eventClass;
                    
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'event-time';
                    timeSpan.textContent = formatTime(event.start, isAllDayEvent(event));
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'event-title';
                    titleSpan.textContent = event.title || 'No Title';
                    
                    eventDiv.appendChild(timeSpan);
                    eventDiv.appendChild(titleSpan);
                    eventsContainer.appendChild(eventDiv);
                });
                
                // Add "+X more" indicator for past dates with hidden events
                if (isPast && hiddenEventCount > 0) {
                    const moreEventsDiv = document.createElement('div');
                    moreEventsDiv.className = 'more-events';
                    moreEventsDiv.textContent = `+${hiddenEventCount} more`;
                    eventsContainer.appendChild(moreEventsDiv);
                }
                
                dayCell.appendChild(eventsContainer);
                grid.appendChild(dayCell);
                
                currentDate.setDate(currentDate.getDate() + 1);
            }
        }

        // Set CSS variable for number of weeks to help with grid layout
        function setWeeksVariable() {
            document.documentElement.style.setProperty('--weeks-count', GRID_WEEKS);
        }

        // Adjust row heights based on content, prioritizing first rows
        function adjustRowHeights() {
            const grid = document.getElementById('calendar-grid');
            if (!grid) return;
            
            const rows = [];
            const totalRows = GRID_WEEKS;
            
            // Group day cells by row (week)
            for (let i = 0; i < totalRows; i++) {
                const rowCells = [];
                for (let j = 0; j < 7; j++) {
                    const cellIndex = i * 7 + j;
                    const cell = grid.children[cellIndex];
                    if (cell) {
                        rowCells.push(cell);
                    }
                }
                if (rowCells.length > 0) {
                    rows.push(rowCells);
                }
            }
            
            // Calculate available height directly from viewport to avoid offsetHeight rounding issues
            const header = document.querySelector('.weekdays-header');
            const headerHeight = header ? header.offsetHeight : 60;
            const availableHeight = window.innerHeight - headerHeight;
            
            // Explicitly set grid height to match calculated available height to prevent whitespace
            grid.style.height = `${availableHeight}px`;
            grid.style.maxHeight = `${availableHeight}px`;
            
            // Calculate gap size and equal row height first (needed for past date row capping)
            const gapSize = 1; // 1px gap between rows
            const totalGaps = (totalRows - 1) * gapSize;
            const equalRowHeight = (availableHeight - totalGaps) / totalRows;
            
            // Calculate minimum height needed for each row based on content
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayKey = getDateKey(today);
            
            const rowMinHeights = rows.map((rowCells, rowIndex) => {
                // Check if all cells in this row are past dates (not including today)
                let allPast = true;
                rowCells.forEach(cell => {
                    // Check if this cell has the 'past' class but NOT 'today' class
                    // Today should not be capped even though it may have past events
                    if (!cell.classList.contains('past') || cell.classList.contains('today')) {
                        allPast = false;
                    }
                });
                
                // If all cells are past dates (excluding today), cap at equal row height (don't allow expansion)
                if (allPast) {
                    return equalRowHeight;
                }
                
                // Otherwise, measure content as normal
                let maxHeight = 0;
                rowCells.forEach(cell => {
                    // Temporarily set height to auto to measure content
                    const originalHeight = cell.style.height;
                    cell.style.height = 'auto';
                    maxHeight = Math.max(maxHeight, cell.scrollHeight);
                    cell.style.height = originalHeight;
                });
                return maxHeight;
            });
            
            // Calculate total minimum height needed (including gaps between rows)
            const totalMinHeight = rowMinHeights.reduce((sum, h) => sum + h, 0) + totalGaps;
            const finalHeights = new Array(totalRows).fill(equalRowHeight);
            
            // Calculate how much extra space each row needs beyond equal height
            const rowExtraNeeded = rowMinHeights.map((minHeight, index) => {
                return Math.max(0, minHeight - equalRowHeight);
            });
            
            // Total extra space needed
            const totalExtraNeeded = rowExtraNeeded.reduce((sum, extra) => sum + extra, 0);
            
            // If we have extra space available, expand rows from top to bottom
            if (totalExtraNeeded > 0) {
                // Calculate available space for expansion
                const spaceForExpansion = availableHeight - totalGaps - (equalRowHeight * totalRows);
                
                // Distribute expansion space from top to bottom
                // Each row gets what it needs before lower rows get any
                let remainingExpansion = spaceForExpansion;
                for (let i = 0; i < totalRows; i++) {
                    if (rowExtraNeeded[i] > 0 && remainingExpansion > 0) {
                        const expansion = Math.min(rowExtraNeeded[i], remainingExpansion);
                        finalHeights[i] = equalRowHeight + expansion;
                        remainingExpansion -= expansion;
                    }
                }
                
                // If there's still remaining space after all rows got what they needed,
                // distribute it equally to all rows
                if (remainingExpansion > 0) {
                    const equalShare = remainingExpansion / totalRows;
                    finalHeights.forEach((height, index) => {
                        finalHeights[index] = height + equalShare;
                    });
                }
            } else {
                // No extra space needed, all rows stay at equal height
                // If there's extra space, distribute equally
                const totalUsed = equalRowHeight * totalRows;
                const extraSpace = availableHeight - totalGaps - totalUsed;
                if (extraSpace > 0) {
                    const equalShare = extraSpace / totalRows;
                    finalHeights.forEach((height, index) => {
                        finalHeights[index] = height + equalShare;
                    });
                }
            }
            
            // Normalize to ensure total equals availableHeight exactly (accounting for gaps)
            const totalRowHeights = finalHeights.reduce((sum, h) => sum + h, 0);
            const totalWithGaps = totalRowHeights + totalGaps;
            if (Math.abs(totalWithGaps - availableHeight) > 0.1) {
                const scaleFactor = (availableHeight - totalGaps) / totalRowHeights;
                finalHeights.forEach((h, i) => {
                    finalHeights[i] = h * scaleFactor;
                });
            }
            
            // Apply heights to rows
            rows.forEach((rowCells, rowIndex) => {
                const rowHeight = finalHeights[rowIndex];
                rowCells.forEach(cell => {
                    cell.style.height = `${rowHeight}px`;
                });
            });
            
            if (availableHeight <= totalMinHeight) {
                // Not enough space - scale down proportionally to fit
                const scaleFactor = (availableHeight - totalGaps) / (totalMinHeight - totalGaps);
                rows.forEach((rowCells, rowIndex) => {
                    const rowHeight = rowMinHeights[rowIndex] * scaleFactor;
                    rowCells.forEach(cell => {
                        cell.style.height = `${rowHeight}px`;
                    });
                });
            }
        }

        // Signal that rendering is complete (for screenshot capture)
        function signalRenderComplete() {
            // Add a class to body to signal rendering is done
            document.body.classList.add('render-complete');
            // Also set a data attribute
            document.body.setAttribute('data-render-complete', 'true');
        }

        // Fetch events and render
        fetch('/api/events')
            .then(response => response.json())
            .then(async events => {
                setWeeksVariable();
                renderWeekdays();
                await renderCalendar(events);
                // Adjust row heights after rendering
                setTimeout(() => {
                    adjustRowHeights();
                    // Signal completion after a brief delay to ensure layout is stable
                    setTimeout(signalRenderComplete, 50);
                }, 100);
            })
            .catch(async error => {
                console.error('Error fetching events:', error);
                setWeeksVariable();
                renderWeekdays();
                await renderCalendar([]);
                setTimeout(() => {
                    adjustRowHeights();
                    setTimeout(signalRenderComplete, 50);
                }, 100);
            });
        
        // Schedule automatic weather refreshes at 12pm and 12am
        scheduleWeatherRefresh();
    </script>
